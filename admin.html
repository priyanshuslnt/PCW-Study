<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Priyanshu Raj</title><link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:850px;margin:0 auto;padding:110px 6% 60px}.admin-card{background:#101010;border:1px solid #292929;border-radius:10px;padding:25px;margin-top:25px}.admin-card h2{font-family:Anton;font-size:42px;margin:0 0 10px}.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-card input{width:100%;background:#080808;border:1px solid #333;color:#fff;padding:13px;border-radius:5px;margin:6px 0 12px}.admin-card label{font-size:12px;color:#aaa}.admin-list{margin-top:25px}.admin-item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252525;padding:14px 0;gap:15px}.admin-item button{border:0;background:#351014;color:#fff;padding:9px 12px;border-radius:4px;cursor:pointer}.back{color:#ff3038;text-decoration:none;font-size:12px;font-weight:800}.locked{color:#888;line-height:1.6}.admin-note{font-size:12px;color:#777}.status{font-size:12px;margin-top:12px;color:#aaa}.logout{float:right}@media(max-width:650px){.admin-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="navbar"><a class="brand" href="index.html">PR<span>.</span></a><a class="back" href="index.html">← BACK TO SITE</a></header>
<main class="admin-wrap">
<p class="eyebrow">PRIVATE AREA</p><h1>ADMIN PANEL</h1>

<div class="admin-card" id="loginBox">
<h2>Owner Login</h2>
<p class="locked">Changes made here are saved centrally in Cloudflare KV and will appear for every visitor.</p>
<label>Password<input id="pass" type="password" placeholder="Admin password"></label>
<button class="btn primary" id="login">Login</button>
<p class="status" id="loginStatus"></p>
</div>

<div class="admin-card" id="panel" hidden>
<button class="btn logout" id="logout">Logout</button>
<h2>Categories</h2>
<form id="form">
<input type="hidden" id="id">
<div class="admin-row"><label>Name<input id="name" required></label><label>Icon<input id="icon" maxlength="4" placeholder="📘"></label></div>
<div class="admin-row"><label>Description<input id="desc"></label><label>URL<input id="url" type="url" required></label></div>
<button class="btn primary" id="submitBtn">Add Category</button>
<button class="btn" type="button" id="cancel" hidden>Cancel Edit</button>
</form>
<p class="status" id="status"></p>
<div class="admin-list" id="list"></div>
</div>
</main>
<script>
let categories=[],password=sessionStorage.getItem("pr_admin_password")||"",editing=null;
const $=id=>document.getElementById(id);
async function api(method,body){
 const r=await fetch("/api/categories",{method,headers:{"content-type":"application/json","X-Admin-Password":password},body:body?JSON.stringify(body):undefined});
 const data=await r.json(); if(!r.ok) throw new Error(data.error||"Request failed"); return data;
}
async function login(){
 password=$("pass").value;
 try{categories=await api("GET");sessionStorage.setItem("pr_admin_password",password);$("loginBox").hidden=true;$("panel").hidden=false;render()}
 catch(e){$("loginStatus").textContent="Wrong password or server not configured."}
}
async function load(){try{categories=await api("GET");$("loginBox").hidden=true;$("panel").hidden=false;render()}catch(e){}}
function render(){$("list").innerHTML=categories.map(c=>`<div class="admin-item"><span>${esc(c.icon||"📘")} <b>${esc(c.name)}</b><br><small>${esc(c.url)}</small></span><span><button onclick="edit('${c.id}')">Edit</button> <button onclick="del('${c.id}')">Delete</button></span></div>`).join("")}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
window.edit=id=>{let c=categories.find(x=>x.id===id);if(!c)return;editing=id;$("id").value=id;$("name").value=c.name;$("desc").value=c.description||"";$("url").value=c.url;$("icon").value=c.icon||"📘";$("submitBtn").textContent="Save Changes";$("cancel").hidden=false}
window.del=async id=>{if(!confirm("Delete this category?"))return;try{categories=await api("DELETE",{id});render();$("status").textContent="Deleted and updated for everyone."}catch(e){$("status").textContent=e.message}}
$("login").onclick=login;
$("pass").onkeydown=e=>{if(e.key==="Enter")login()};
$("form").onsubmit=async e=>{e.preventDefault();let c={id:editing,name:$("name").value.trim(),description:$("desc").value.trim(),url:$("url").value.trim(),icon:$("icon").value.trim()||"📘"};try{categories=await api(editing?"PUT":"POST",c);editing=null;e.target.reset();$("submitBtn").textContent="Add Category";$("cancel").hidden=true;render();$("status").textContent="Saved. All visitors now see the update."}catch(err){$("status").textContent=err.message}}
$("cancel").onclick=()=>{editing=null;$("form").reset();$("submitBtn").textContent="Add Category";$("cancel").hidden=true}
$("logout").onclick=()=>{sessionStorage.removeItem("pr_admin_password");location.reload()}
if(password)load();
</script>
</body></html>
