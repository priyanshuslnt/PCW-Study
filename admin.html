<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Priyanshu Raj — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}
.wrap{width:min(1050px,92%);margin:auto;padding:30px 0 60px}h1{margin:0 0 6px}
.muted{color:#999}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:22px;margin-top:20px}
input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;background:#080808;border:1px solid #333;border-radius:9px;color:#fff}
textarea{min-height:90px;resize:vertical}button{padding:11px 15px;border:0;border-radius:9px;background:#fff;color:#000;font-weight:700;cursor:pointer}
button.secondary{background:#222;color:#fff;border:1px solid #444}button.danger{background:#321313;color:#ffb5b5;border:1px solid #632525}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:grid;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap}
.item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid #252525}
.item:last-child{border:0}.left{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#080808;padding:5px}
.info strong{display:block;font-size:17px}.info small{display:block;color:#999;margin-top:4px;word-break:break-all}
#loginStatus,#status{margin-top:10px;color:#aaa;min-height:20px}.section-title{margin:0 0 14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.left{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<h1>Priyanshu Raj — Admin</h1>
<div class="muted">Manage categories, logos and the Download section.</div>

<section id="login" class="panel">
<h2>Admin Login</h2>
<form id="loginForm" class="form">
<input id="password" type="password" placeholder="Admin password" required>
<button>Login</button>
</form>
<div id="loginStatus"></div>
</section>

<div id="app" style="display:none">
<section class="panel">
<h2 class="section-title" id="catTitle">Add Category</h2>
<form id="catForm" class="form">
<input type="hidden" id="editId">
<div class="grid">
<input id="name" placeholder="Category name" required>
<input id="icon" placeholder="Emoji fallback e.g. 📚">
</div>
<input id="logo" type="url" placeholder="Logo image URL (https://...png / .jpg / .svg)">
<input id="url" type="url" placeholder="Course/website URL" required>
<input id="description" placeholder="Short description">
<div class="actions">
<button id="saveCat">Add Category</button>
<button type="button" class="secondary" id="cancelEdit" style="display:none">Cancel Edit</button>
</div>
</form>
<div id="status"></div>
</section>

<section class="panel">
<h2 class="section-title">Categories</h2>
<div id="list"></div>
</section>

<section class="panel">
<h2 class="section-title">Download Section</h2>
<form id="settingsForm" class="form">
<input id="downloadEyebrow" placeholder="Small heading e.g. MOBILE">
<input id="downloadTitle" placeholder="Title. Use &lt;br&gt; for line break">
<textarea id="downloadText" placeholder="Download section description"></textarea>
<input id="downloadButton" placeholder="Button text">
<input id="downloadUrl" placeholder="APK/file URL or path, e.g. app-release.apk">
<button>Save Download Section</button>
</form>
<div id="settingsStatus"></div>
</section>

<div class="actions" style="margin-top:20px">
<button class="secondary" id="logout">Logout</button>
<a href="/" style="color:#fff;padding:12px 4px">← Open website</a>
</div>
</div>
</div>

<script>
let password=sessionStorage.getItem("pcw_admin_password")||"";
let categories=[];const $=id=>document.getElementById(id);

function showApp(ok){$("login").style.display=ok?"none":"block";$("app").style.display=ok?"block":"none"}
async function api(path,opt={}){const headers=Object.assign({},opt.headers||{},{"X-Admin-Password":password});const r=await fetch(path,Object.assign({},opt,{headers}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
 $("list").innerHTML=categories.length?categories.map(c=>`
 <div class="item">
  <div class="left">
   ${c.logo?`<img class="logo" src="${esc(c.logo)}" onerror="this.style.display='none'">`:`<div class="logo" style="display:grid;place-items:center;font-size:28px">${esc(c.icon||"📚")}</div>`}
   <div class="info"><strong>${esc(c.name)}</strong><small>${esc(c.url)}</small>${c.logo?`<small>Logo: ${esc(c.logo)}</small>`:""}</div>
  </div>
  <div class="actions">
   <button onclick="editCategory('${esc(c.id)}')">Edit</button>
   <button class="danger" onclick="removeCategory('${esc(c.id)}')">Delete</button>
  </div>
 </div>`).join(""):'<div class="muted">No categories yet.</div>';
}
function resetForm(){
 $("editId").value="";$("name").value="";$("icon").value="";$("logo").value="";$("url").value="";$("description").value="";
 $("catTitle").textContent="Add Category";$("saveCat").textContent="Add Category";$("cancelEdit").style.display="none";
}
window.editCategory=id=>{
 const c=categories.find(x=>String(x.id)===String(id));if(!c)return;
 $("editId").value=c.id;$("name").value=c.name||"";$("icon").value=c.icon||"";$("logo").value=c.logo||"";
 $("url").value=c.url||"";$("description").value=c.description||"";
 $("catTitle").textContent="Edit Category";$("saveCat").textContent="Update Category";$("cancelEdit").style.display="inline-block";
 window.scrollTo({top:0,behavior:"smooth"});
};
window.removeCategory=async id=>{
 if(!confirm("Delete this category?"))return;
 try{const d=await api("/api/categories?id="+encodeURIComponent(id),{method:"DELETE"});categories=d.categories;render();$("status").textContent="Category deleted."}
 catch(e){$("status").textContent=e.message}
};
async function load(){
 try{
  const check=await fetch("/api/admin/check",{headers:{"X-Admin-Password":password}});
  if(!check.ok)throw Error();
  categories=await (await fetch("/api/categories",{cache:"no-store"})).json();render();
  const s=await (await fetch("/api/settings",{cache:"no-store"})).json();
  $("downloadEyebrow").value=s.downloadEyebrow||"";$("downloadTitle").value=s.downloadTitle||"";
  $("downloadText").value=s.downloadText||"";$("downloadButton").value=s.downloadButton||"";
  $("downloadUrl").value=s.downloadUrl||"";
  showApp(true);
 }catch(e){sessionStorage.removeItem("pcw_admin_password");password="";showApp(false)}
}
$("loginForm").onsubmit=async e=>{e.preventDefault();password=$("password").value;
 try{const r=await fetch("/api/admin/check",{headers:{"X-Admin-Password":password}});if(!r.ok)throw Error();
 sessionStorage.setItem("pcw_admin_password",password);$("loginStatus").textContent="";load()
 }catch{$("loginStatus").textContent="Wrong password."}};
$("catForm").onsubmit=async e=>{e.preventDefault();$("status").textContent="Saving...";
 try{const d=await api("/api/categories",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({
 id:$("editId").value||undefined,name:$("name").value,icon:$("icon").value,logo:$("logo").value,url:$("url").value,description:$("description").value
 })});categories=d.categories;render();resetForm();$("status").textContent="Saved for everyone."}catch(e){$("status").textContent=e.message}};
$("cancelEdit").onclick=resetForm;
$("settingsForm").onsubmit=async e=>{e.preventDefault();$("settingsStatus").textContent="Saving...";
 try{await api("/api/settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
 downloadEyebrow:$("downloadEyebrow").value,downloadTitle:$("downloadTitle").value,downloadText:$("downloadText").value,downloadButton:$("downloadButton").value,downloadUrl:$("downloadUrl").value
 })});$("settingsStatus").textContent="Download section updated for everyone."}catch(e){$("settingsStatus").textContent=e.message}};
$("logout").onclick=()=>{sessionStorage.removeItem("pcw_admin_password");password="";showApp(false)};
if(password)load();else showApp(false);
</script>
</body>
</html>
